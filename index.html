
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BigMart Gourmet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-orange: #ff5221;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background-color: #f1f3f6;
    }
    body {
      overflow-x: hidden; /* Prevent horizontal scroll only at the outermost level */
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes slideInFromRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .slide-in-from-right {
      animation: slideInFromRight 0.3s ease-out forwards;
    }

    @keyframes slideInFromLeft {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .slide-in-from-left {
      animation: slideInFromLeft 0.3s ease-out forwards;
    }
    
    .bg-brand { background-color: var(--brand-orange); }
    .text-brand { color: var(--brand-orange); }
    .border-brand { border-color: var(--brand-orange); }
    
    /* Smooth transitions for sticky header shadow */
    header {
      transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }
  </style>

</html>
